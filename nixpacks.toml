[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
# 2026-09-08 — `db push --accept-data-loss` replaced by `migrate deploy`.
# See the long rationale in the Dockerfile builder stage: db push never
# read prisma/migrations, so the migration history drifted three files
# behind the schema for months, and that disagreement is what led to
# production being reset during the Sept 2026 incident.
#
# Consequence to keep in mind: a schema.prisma change without a
# committed migration file will not reach production. Generate one with
# `prisma migrate dev` and commit it with the schema change.
cmd = "npx prisma migrate deploy && npm run start"
