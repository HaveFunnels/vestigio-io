# Source-level checks. No secrets, no network, no database.
#
# Deliberately does NOT duplicate the acquisition smoke: these assert
# the source is correct, and the smoke asserts the deployment is. Every
# acquisition outage this product has had passed checks like these and
# broke anyway, because the fault was in the image, not the source.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # next-env.d.ts is generated by next build/dev and is gitignored,
      # so it never exists on a fresh checkout. Without it tsc cannot
      # resolve PNG imports (`@/../public/images/logo/logo-light.png`)
      # and typecheck fails on 8 files.
      #
      # That is why this workflow failed 13 times out of 13 and never
      # once passed: typecheck died, which SKIPPED the unit tests and
      # the legacy suite, so the only thing CI ever actually ran was
      # the invariants. It looked like coverage and was not.
      #
      # The third reference Next writes (./.next/types/routes.d.ts)
      # only exists after a build, and is deliberately omitted: the
      # tsconfig include tolerates the missing glob, and typed routes
      # are not what this step is checking.
      - name: next type shims
        run: |
          if [ ! -f next-env.d.ts ]; then
            printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          fi

      # The 11 invariants. Three of them exist because of regressions
      # that reached production: the Dockerfile ARG list, the CSP
      # script hosts, and every Turnstile-gated route having a caller
      # that sends a token.
      - name: invariants
        run: npx tsx scripts/check-invariants.ts

      - name: typecheck
        run: npx tsc --noEmit

      - name: unit tests
        run: npx vitest run

      # tests/** is a separate node-test-runner suite that the vitest
      # config excludes. It is easy to forget it exists, so CI runs it.
      - name: legacy suite
        run: npx tsx --test tests/all.test.ts

      # The build catches a class tsc cannot see. A real example from
      # this repo: an import placed above "use client" typechecks
      # cleanly and fails the build, and it reached main because only
      # the production build looks at directive ordering.
      - name: production build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: npx next build --no-lint
